name: Build Windows static binary
on:
  workflow_dispatch:
    inputs:
      extensions:
        description: PHP extensions to build
        required: false
  push:
    paths:
      - build-static.ps1
      - .github/workflows/static-windows.yaml
  pull_request:
    paths:
      - build-static.ps1
      - .github/workflows/static-windows.yaml
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: windows-x86_64
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      # A reduced extension set is used in CI to keep the build time reasonable
      PHP_EXTENSIONS: ${{ inputs.extensions || 'bcmath,ctype,curl,dom,filter,fileinfo,iconv,mbstring,opcache,openssl,pdo,pdo_sqlite,phar,session,simplexml,sockets,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib' }}
      PHP_EXTENSION_LIBS: nghttp2
      # Authenticate static-php-cli's GitHub API calls to avoid rate limiting
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # FrankenPHP requires Go >= 1.26 (Clang/MSVC support); make sure the runner's
      # preinstalled older Go can never shadow it
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
          cache: false
      - run: go version
      - name: Probe clang -mthreads support
        run: |
          'int main(void){return 0;}' | Set-Content t.c
          foreach ($c in @("C:\Program Files\LLVM\bin\clang.exe", "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\Llvm\x64\bin\clang.exe")) {
            if (Test-Path $c) {
              & $c --version | Select-Object -First 1
              & $c -mthreads -c t.c -o t.o 2>&1 | Select-Object -First 2
              "exit=$LASTEXITCODE"
            } else {
              "missing: $c"
            }
          }
          Remove-Item t.c, t.o -ErrorAction SilentlyContinue
      - name: Build static binary
        env:
          # Go unconditionally passes the MinGW-only -mthreads flag to the C compiler on
          # Windows; Visual Studio's bundled Clang rejects it while the standalone LLVM
          # Clang only warns. Use the latter, like FrankenPHP's own Windows CI does.
          CC: C:\Program Files\LLVM\bin\clang.exe
          CXX: C:\Program Files\LLVM\bin\clang++.exe
        run: .\build-static.ps1
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frankenphp-windows-x86_64
          path: dist/frankenphp-windows-x86_64.exe
      - name: Show static-php-cli logs
        if: failure()
        run: Get-Content dist\static-php-cli\log\spc.shell.log -Tail 300 -ErrorAction SilentlyContinue
      - name: Upload static-php-cli logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spc-logs
          path: dist/static-php-cli/log/
